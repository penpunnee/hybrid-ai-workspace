<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบความดังเสียง A/B</title>
<style>
body{font-family:-apple-system,sans-serif;background:#111;color:#eee;margin:0;padding:16px;line-height:1.5}
h1{font-size:20px;margin:0 0 8px}
button{display:block;width:100%;font-size:18px;padding:16px;margin:10px 0;border-radius:12px;border:0;background:#2d5bd8;color:#fff;text-align:left}
button.stop{background:#a33}
small{color:#aaa}
#log{white-space:pre-wrap;font-size:12px;color:#9c9;background:#000;padding:8px;border-radius:8px;min-height:60px}
</style></head><body>
<h1>🔊 ทดสอบความดังเสียงขวัญ (A/B)</h1>
<small>เสียงท่อนเดียวกันทุกปุ่ม (15 วิ) · ระดับเสียงเครื่องเท่าเดิมทุกครั้ง · กดทีละปุ่ม ฟังเทียบว่าปุ่มไหนดัง/เบา</small>
<button id="a">A · แบบโหมดอ่าน (ไม่เปิดไมค์)</button>
<button id="b">B · แบบโหมดคุย (เปิดไมค์ค้างไว้ระหว่างเล่น)</button>
<button id="c">C · ลำดับเดียวกับแอปจริง (เปิดไมค์ → เริ่มเล่น → ปิดไมค์กลางทาง)</button>
<button id="e">E · แบบโหมดอ่าน + ตั้ง audioSession = "playback" (ตัวแก้ที่จะลอง)</button>
<button id="d">D · เล่นผ่าน &lt;audio&gt; ปกติ (เทียบกับ YouTube)</button>
<button id="s" class="stop">⏹ หยุดทั้งหมด</button>
<div id="log"></div>
<script>
// ⚠️ หน้าทดสอบชั่วคราว (2026-09-21) — ใช้ worklet 'pcm-player' ตัวเดียวกับแอปเป๊ะ
// (คัดจาก ~/appscript.ui/utils/voicelive.ts WORKLET_SRC) · ลบทิ้งได้เมื่อหาต้นเหตุเจอ
const WORKLET_SRC = `
class PCMPlayer extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const o = (options && options.processorOptions) || {};
    this.srcRate = o.srcRate || 24000;
    this.ratio = this.srcRate / sampleRate;
    this.minPrime = this.srcRate * (o.primeSec || 0.2);
    this.queue = []; this.pos = 0; this.primed = false;
    this.port.onmessage = (e) => {
      const d = e.data;
      if (d === 'flush') { this.queue = []; this.pos = 0; this.primed = false; return; }
      this.queue.push(d);
    };
  }
  _avail() { let n = 0; for (let k = 0; k < this.queue.length; k++) n += this.queue[k].length; return n - this.pos; }
  process(_i, outputs) {
    const out = outputs[0][0];
    if (!out) return true;
    if (!this.primed) {
      if (this._avail() < this.minPrime) { for (let i=0;i<out.length;i++) out[i]=0; return true; }
      this.primed = true;
    }
    for (let i = 0; i < out.length; i++) {
      if (this.queue.length === 0) {
        // 🔊 ชั้นวัด (2026-08-26): **นับอย่างเดียว ไม่เปลี่ยนพฤติกรรมเสียง** —
        // re-prime บรรทัดเดิมยังอยู่ครบ · ยิงเฉพาะ**ขอบขาลง** (primed true→false)
        // = 1 ครั้งต่อ 1 ช่วงเสียงหาย ⇒ ไม่ท่วมและตรงกับสิ่งที่หูได้ยิน
        if (this.primed) this.port.postMessage({ u: 1 });
        this.primed = false; out[i] = 0; continue; // underrun → re-prime กัน click
      }
      const cur = this.queue[0];
      const idx = this.pos | 0;
      const frac = this.pos - idx;
      const s0 = cur[idx];
      let s1;
      if (idx + 1 < cur.length) s1 = cur[idx + 1];
      else if (this.queue.length > 1) s1 = this.queue[1][0];
      else s1 = s0;
      out[i] = s0 + (s1 - s0) * frac;
      this.pos += this.ratio;
      while (this.queue.length && this.pos >= this.queue[0].length) { this.pos -= this.queue[0].length; this.queue.shift(); }
    }
    return true;
  }
}
registerProcessor('pcm-player', PCMPlayer);
`;
const SRC_RATE = 24000, PRIME = 0.8;
const MIC = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false };
const workletUrl = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
let pcm = null, live = [];
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
async function clip() {
  if (pcm) return pcm;
  const buf = await (await fetch('/static/ab_sample.wav')).arrayBuffer();
  const i16 = new Int16Array(buf, 44);
  pcm = new Float32Array(i16.length);
  for (let i = 0; i < i16.length; i++) pcm[i] = i16[i] / 32768;
  return pcm;
}
async function stopAll() {
  for (const x of live) { try { x.stop ? x.stop() : x.getTracks ? x.getTracks().forEach(t => t.stop()) : x.close ? await x.close() : x.pause(); } catch (e) {} }
  live = [];
}
async function player() {          // เหมือน BookReader.connect / VoiceController playback
  const ctx = new AudioContext(); live.push(ctx);
  await ctx.audioWorklet.addModule(workletUrl);
  const node = new AudioWorkletNode(ctx, 'pcm-player', { numberOfInputs: 0, numberOfOutputs: 1,
    outputChannelCount: [1], processorOptions: { srcRate: SRC_RATE, primeSec: PRIME } });
  node.connect(ctx.destination);
  if (ctx.state !== 'running') await ctx.resume();
  return { ctx, play: async () => { const f = await clip(); for (let o = 0; o < f.length; o += 4800) node.port.postMessage(f.slice(o, o + 4800)); } };
}
async function micOpen() {         // เหมือน VoiceController.connect: getUserMedia + capCtx + ScriptProcessor
  const s = await navigator.mediaDevices.getUserMedia(MIC); live.push(s);
  const cap = new AudioContext(); live.push(cap);
  const src = cap.createMediaStreamSource(s);
  const proc = cap.createScriptProcessor(4096, 1, 1);
  src.connect(proc); proc.connect(cap.destination);
  return { s, cap };
}
const sess = () => (navigator.audioSession ? navigator.audioSession.type : 'ไม่มี API');
function info(tag, p) { log(`${tag}: ctx=${p.ctx.state} sr=${p.ctx.sampleRate} audioSession=${sess()}`); }
const run = (id, fn) => document.getElementById(id).onclick = async () => {
  try { await stopAll(); await clip(); await fn(); } catch (e) { log(id + ' ❌ ' + e); }
};
const auto = () => { if (navigator.audioSession) navigator.audioSession.type = 'auto'; };
run('a', async () => { auto(); const p = await player(); info('A', p); await p.play(); });
run('b', async () => { auto(); await micOpen(); const p = await player(); info('B (ไมค์เปิด)', p); await p.play(); });
run('c', async () => { auto();
  const m = await micOpen(); const v = await player();           // สายเสียงของโหมดคุย
  const r = await player(); info('C', r); await r.play();          // ตัวอ่านนิยายเริ่มเล่น
  setTimeout(async () => { m.s.getTracks().forEach(t => t.stop()); try { await m.cap.close(); await v.ctx.close(); } catch (e) {} log('C: ปิดไมค์แล้ว (วิที่ 1)'); }, 1000);
});
run('e', async () => {
  if (!navigator.audioSession) { log('E ❌ เครื่องนี้ไม่มี navigator.audioSession'); return; }
  navigator.audioSession.type = 'playback';          // ต้องตั้งก่อนสร้าง AudioContext
  const p = await player(); info('E', p); await p.play();
});
run('d', async () => { auto(); const a = new Audio('/static/ab_sample.wav'); live.push(a); await a.play(); log('D: <audio>'); });
document.getElementById('s').onclick = () => { stopAll(); log('หยุด'); };
</script></body></html>
