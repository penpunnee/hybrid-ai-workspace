[pytest]
# Suppress deprecation warnings จาก library upstream (ไม่ใช่บั๊กในโค้ดเรา)
# จะมีผลกระทบเมื่อ Python 3.16/3.17 release — ยังมีเวลาเหลือ ~3 ปี
filterwarnings =
    # google-genai: ใช้ Python internal _UnionGenericAlias (จะ break ใน 3.17)
    ignore:.*_UnionGenericAlias.*:DeprecationWarning:google.genai.*
    # chromadb: ใช้ asyncio.iscoroutinefunction (deprecated ตั้งแต่ 3.8, จะ break ใน 3.16)
    ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning:chromadb.*
