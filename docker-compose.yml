services:
  hybrid-ai:
    build: .
    container_name: ai-backend-1
    # always (เดิม unless-stopped) — เคย "หาย" 2 ครั้ง (2026-06-14/15, 2026-06-17) ตอน Container Manager restart
    # เหมือน chromadb: always = กลับมาเองแม้ exit/หลัง daemon restart. คู่กับ backend-watchdog ด้านล่าง (กันเคส container ถูก "ลบ" ที่ restart policy ช่วยไม่ได้)
    restart: always
    ports:
      - "8080:8000"
    healthcheck:
      # ใช้ python urllib (มีแน่ใน image FastAPI) ยิง /api/config (open path ไม่ต้อง auth) บนพอร์ตภายใน 8000
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/config',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # เผื่อ boot upsert skills เข้า ChromaDB (~30-60s)
    volumes:
      - ${NAS_DATA_PATH:-./data}/chat_history.db:/app/chat_history.db
      - ./identity.json:/app/identity.json
      - ${OBSIDIAN_VAULT_NAS_PATH:-./data}:/vault
      - ${NAS_DATA_PATH:-./data}/dream_reports:/app/dream_reports
      - ${NAS_DATA_PATH:-./data}/skills_db.json:/app/skills_db.json
      # BUG FIX: mount skills/ folder ไม่งั้นไฟล์ .md หายทุกครั้งที่ recreate
      - ${NAS_DATA_PATH:-./data}/skills:/app/skills
      # mount logs dir → ดู server.log จาก host ได้ + persist หลัง restart
      - ${NAS_DATA_PATH:-./data}/logs:/app/logs
      # DB backup 03:30 (core/scheduler.py) เขียนที่นี่ — ต้อง mount ไม่งั้นหายตอน recreate
      - ${NAS_DATA_PATH:-./data}/db_backups:/app/db_backups
      # ⚠️ /app/data = ค่า default ของ NAS_DATA_PATH ใน core/config.py (env ในคอนเทนเนอร์ไม่ได้ตั้ง)
      # เป็นที่อยู่จริงของ embed_cache.db / response_cache.db / gen_images
      # ไม่ mount = หายทุกครั้งที่ `up -d --force-recreate` ทั้งที่ config เขียนว่า
      # "under NAS_DATA_PATH for persistence" (เจอจริง 2026-08-03: embed cache 7.5MB
      # 1,791 embeddings อยู่ใน writable layer ล้วน — backlog ข้อ 6)
      - ${NAS_DATA_PATH:-./data}:/app/data
      # sandbox ของ fs_* tools — default เดิมคือ ~/Desktop/ui/sandbox (layout เครื่อง Mac)
      # ในคอนเทนเนอร์กลายเป็น /root/Desktop/ui/sandbox ที่ว่างเปล่าและหายตอน recreate
      # → agent อ่าน/เขียนอะไรจริงไม่ได้เลย ต้องคู่กับ FS_TOOLS_ROOTS=/app/sandbox ใน .env
      - ${NAS_DATA_PATH:-./data}/sandbox:/app/sandbox
      - ./static:/app/static
      - ./utils:/app/utils
      - ./assistants:/app/assistants
      - ./core:/app/core
      - ./routers:/app/routers
      - ./memory:/app/memory
      - ./reasoning:/app/reasoning
      - ./agents:/app/agents
      - ./server.py:/app/server.py
      - ./tests:/app/tests
      - chroma_model_cache:/root/.cache/chroma
    environment:
      - DB_PATH=/app/chat_history.db
      - OBSIDIAN_VAULT_PATH=/vault
      - LOG_FILE=/app/logs/server.log
    env_file:
      - .env

  chromadb:
    # pin ด้วย digest (image 2026-05-05) — เดิม :latest เปลี่ยน persist path เงียบๆ (/chroma/chroma→/data) จนเกือบเสีย data
    # อัปเดตเมื่อจะขึ้น version ใหม่เท่านั้น (ทดสอบ persist path ก่อน)
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    container_name: chromadb
    # always (เดิม unless-stopped) — chromadb เคยดับเงียบ 8 วัน ไม่กลับมาเอง; always = auto-restart แม้ exit 0/หลัง reboot
    restart: always
    ports:
      - "8000:8000"
    volumes:
      # chroma :latest persist ที่ /data (เดิม mount /chroma/chroma → image รุ่นใหม่ไม่ใช้ → data ไม่ persist หายตอน recreate)
      - chroma_data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ai-cloudflared
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run ai-workspace
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/services/homes/pawin/.cloudflared:/etc/cloudflared

  # Watchdog: กัน ai-backend-1 "หาย/ดับ" ซ้ำ (Container Manager restart ลบ container — restart policy ช่วยไม่ได้)
  # ทุก 60s ถ้า ai-backend-1 ไม่ running → `docker compose up -d hybrid-ai` (idempotent: recreate ถ้าหาย, start ถ้า stopped, no-op ถ้าปกติ)
  # mount project dir ที่ path เดียวกับ host (/volume1/homes/pawin/ui) → compose-in-container resolve bind-mount เป็น host path ถูก
  backend-watchdog:
    image: docker:cli
    container_name: ai-backend-watchdog
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/homes/pawin/ui:/volume1/homes/pawin/ui
    working_dir: /volume1/homes/pawin/ui
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "[watchdog] started — เฝ้า ai-backend-1 ทุก 60s";
        while true; do
          if [ -z "$$(docker ps -q -f name=^ai-backend-1$$ -f status=running)" ]; then
            echo "[watchdog] $$(date -u +%FT%TZ) ai-backend-1 ไม่ running → docker compose up -d hybrid-ai";
            docker compose up -d hybrid-ai 2>&1 || echo "[watchdog] up failed";
          fi;
          sleep 60;
        done

volumes:
  chroma_data:
  chroma_model_cache:
