name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # conftest.py ชี้ host → localhost (ไม่มี ChromaDB/Ollama จริงใน CI = connect refused เร็ว)
        # UI_PASSWORD="" + DB_PATH temp file ถูกตั้งใน tests/conftest.py แล้ว
        run: pytest tests/ -q
