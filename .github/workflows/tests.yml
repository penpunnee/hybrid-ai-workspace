name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # conftest.py ชี้ host → localhost (ไม่มี ChromaDB/Ollama จริงใน CI = connect refused เร็ว)
        # UI_PASSWORD="" + DB_PATH temp file ถูกตั้งใน tests/conftest.py แล้ว
        run: pytest tests/ -q

      - name: Run JS tests (static modules)
        # pure modules dual-export (dream_stats, chat_intercept) — node 24 pin ผ่าน setup-node ด้านบน
        run: node --test tests/*.test.js
